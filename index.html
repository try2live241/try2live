        letter-spacing:0.3px; text-decoration:none; text-transform:uppercase; box-shadow:0 8px 20px rgba(255,0,0,0.35);

    .btn-subscribe:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(255,0,0,0.5); }
    .schedule-note { margin-top:10px; font-size:0.75rem; color:var(--text-muted); font-style:italic; }
    .filter-tabs { display:flex; justify-content:center; gap:8px; padding:16px 20px 8px; flex-wrap:wrap; }
    .tab-btn { background-color:#1a202c; border:1px solid var(--border-color); color:var(--text-muted); padding:6px 16px; border-radius:20px; font-size:0.82rem; font-weight:600; cursor:pointer; transition:all 0.25s ease; }

    .search-row input:focus { border-color: var(--sw-color); }
    .search-row input::placeholder { color: var(--text-muted); }
    .search-wrap { position:relative; }

    .search-clear:hover { color:#fff; }

    .schedule-card { background-color:#181e29; border:1px solid var(--border-color); border-radius:14px; padding:18px 20px; display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:16px; position:relative; overflow:hidden; transition:all 0.3s ease; }

    .schedule-card.switch::before { background-color:#ff3344; }
    .schedule-card.other::before { background-color:#8b949e; }
    .live-indicator {

    .schedule-card.switch:hover { box-shadow:0 10px 24px rgba(255,51,68,0.35); }

    .game-name { font-size:1.05rem; font-weight:700; color:#fff; }

    .schedule-card.switch .live-badge { background-color:#231215; border:1px solid rgba(255,51,68,0.35); color:#ff6b7a; }

    .live-badge .badge-time { font-size:0.9rem; font-weight:800; }
    .footer-note { text-align:center; padding:14px 20px 22px; font-size:0.75rem; color:var(--text-muted); }
    .queue-section { margin:10px 20px 24px; background-color:#121620; border:1px dashed #343d52; border-radius:14px; padding:16px 18px; }

    .queue-title { font-size:0.85rem; font-weight:700; text-transform:uppercase; color:#f59e0b; letter-spacing:0.5px; }
    .queue-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
    .queue-card { background-color:#1a202c; border:1px solid #2d3748; border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; transition:all 0.2s ease; }
    .queue-card:hover { transform:translateY(-2px); background-color:#242c3d; border-color:#4a5568; }
    .queue-name { font-size:0.88rem; font-weight:700; color:#e2e8f0; }

    .view-toggle { display:flex; gap:8px; padding:16px 20px 0; }

    .view-toggle-btn:hover { color:#fff; }
    .view-toggle-btn.active { background-color:var(--sw-color); color:#04222c; border-color:var(--sw-color); }

    .week-nav-btn {

    @media (max-width:620px) {
        .schedule-card { grid-template-columns:1fr; gap:10px; }
        .live-badge { align-items:flex-start; text-align:left; width:100%; }
        .week-nav-btn { padding:6px 10px; font-size:0.72rem; }
    }
</style>

            const searchInput = document.getElementById('gameSearchInput');
            if (searchInput) searchInput.placeholder = t.searchPlaceholder;

            const txtBtnPrev = document.getElementById('txtBtnPrev');
            if (txtBtnPrev) txtBtnPrev.textContent = t.btnPrevWeek;

            const txtBtnCurrent = document.getElementById('txtBtnCurrent');
            if (txtBtnCurrent) txtBtnCurrent.textContent = t.btnCurrentWeek;

            const txtBtnNext = document.getElementById('txtBtnNext');
            if (txtBtnNext) txtBtnNext.textContent = t.btnNextWeek;

            const swipeHint = document.getElementById('weekSwipeHint');
            if (swipeHint) swipeHint.textContent = t.swipeHint;

            const footerNote = document.getElementById('footerNote');
            if (footerNote) footerNote.textContent = t.footerNoteViewer;

            renderSchedule();
            renderQueue();
        }

        function tagLabel(platform) {
            const t = I18N[currentLang];
            const pcIcon = '<svg class="platform-icon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><rect x="2" y="4" width="20" height="13" rx="1.5"></rect><rect x="9" y="19" width="6" height="1.6" rx="0.8"></rect></svg>';
            const switchIcon = '<svg class="platform-icon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><rect x="2" y="7" width="20" height="10" rx="5"></rect><rect x="6.4" y="10.7" width="4" height="1.5" fill="#ffffff"></rect><rect x="7.65" y="9.45" width="1.5" height="4" fill="#ffffff"></rect><circle cx="17" cy="9.8" r="1.05" fill="#ffffff"></circle><circle cx="15" cy="12.3" r="1.05" fill="#ffffff"></circle></svg>';
            if (platform === 'pc') return { cls: 'tag-pc', text: 'PC', icon: pcIcon };
            if (platform === 'switch') return { cls: 'tag-switch', text: 'Switch 2', icon: switchIcon };
            return { cls: 'tag-other', text: t.platformOther, icon: '' };
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function parseVNDateTime(dateStr, timeStr) {
            if (!dateStr || !timeStr) return null;
            const parts = dateStr.split('/');
            if (parts.length !== 3) return null;
            const d = Number(parts[0]), m = Number(parts[1]), y = Number(parts[2]);
            const timeParts = timeStr.split(':');
            const hh = Number(timeParts[0]), mm = Number(timeParts[1]) || 0;
            if (!d || !m || !y || isNaN(hh)) return null;
            return Date.UTC(y, m - 1, d, hh, mm) - 7 * 3600 * 1000;
        }

        function getLiveRange(item) {
            const startMs = parseVNDateTime(item.dateStr, item.start);
            if (startMs === null) return null;
            let endMs = item.end ? parseVNDateTime(item.dateStr, item.end) : startMs + 2 * 3600 * 1000;
            if (endMs === null || endMs <= startMs) endMs = startMs + 2 * 3600 * 1000;
            return { startMs, endMs };
        }

        function renderSchedule() {
            const t = I18N[currentLang];
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';
            if (SCHEDULE_DATA.length === 0) {
                list.innerHTML = '<div class="empty-note">' + t.emptyFilter + '</div>';
                renderWeekView(SCHEDULE_DATA);
                return;
            }
            SCHEDULE_DATA.forEach((item, index) => {
                const d = new Date(item.timestamp);
                const weekday = t.weekdays[d.getDay()];
                const tag = tagLabel(item.platform);
                const range = getLiveRange(item);
                const card = document.createElement('div');
                card.className = 'schedule-card ' + item.platform;
                card.setAttribute('data-category', item.platform);
                card.style.animationDelay = Math.min(index, 10) * 0.05 + 's';
                if (range) {
                    card.dataset.startMs = range.startMs;
                    card.dataset.endMs = range.endMs;
                }
                card.innerHTML = `
                    <div class="date-col">
                        <div class="date-day">${escapeHtml(item.dateStr)}</div>
                        <div class="date-weekday">${weekday}</div>
                    </div>
                    <div class="game-col">
                        <div class="game-title-wrap">
                            <span class="game-name">${escapeHtml(item.game)}</span>
                            <span class="tag-platform ${tag.cls}">${tag.icon}${tag.text}</span>
                            <a class="live-indicator" href="https://youtube.com/@try2_live" target="_blank" rel="noopener noreferrer" style="display:none;">🔴 LIVE</a>
                            <span class="countdown-badge" style="display:none;"></span>
                            <span class="streamed-badge" style="display:none;">${t.badgeEnded}</span>
                        </div>
                    </div>
                    <div class="live-badge">
                        <span class="badge-label">${t.badgeLiveWindow}</span>
                        <span class="badge-time">${escapeHtml(item.start || '--:--')} – ${escapeHtml(item.end || '--:--')}</span>
                    </div>`;
                list.appendChild(card);
            });
            applyFilters();
            updateLiveBadges();
            renderWeekView(SCHEDULE_DATA);
        }

        function renderQueue() {
            const wrap = document.getElementById('queueSectionWrap');
            if (QUEUE_DATA.length === 0) {
                wrap.innerHTML = '';
                return;
            }
            const t = I18N[currentLang];
            const cards = QUEUE_DATA.map(item => {
                const tag = tagLabel(item.platform);
                return `<div class="queue-card"><span class="queue-name">${escapeHtml(item.game)}</span><span class="tag-platform ${tag.cls}">${tag.icon}${tag.text}</span></div>`;
            }).join('');
            wrap.innerHTML = `
                <div class="queue-section">
                    <div class="queue-header"><span class="queue-title">${t.queueHeading}</span></div>
                    <div class="queue-grid">${cards}</div>
                </div>`;
        }

        function getMondayOfWeek(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1 - day);
            d.setDate(d.getDate() + diff);
            return d;
        }

        function getWeekDataStructure(data) {
            const currentMonday = getMondayOfWeek(new Date()).getTime();
            const weeks = {};
            data.forEach(item => {
                const monday = getMondayOfWeek(new Date(item.timestamp)).getTime();
                if (!weeks[monday]) weeks[monday] = [];
                weeks[monday].push(item);
            });
            const weekKeysSet = new Set(Object.keys(weeks).map(Number));
            weekKeysSet.add(currentMonday);
            const weekKeys = Array.from(weekKeysSet).sort((a, b) => a - b);
            return { weeks, weekKeys, currentMonday };
        }

        function ensureSelectedWeek(data) {
            const { weeks, weekKeys, currentMonday } = getWeekDataStructure(data);
            if (weekKeys.length === 0) {
                selectedWeekMonday = null;
                return;
            }
            if (selectedWeekMonday !== null && weekKeys.includes(selectedWeekMonday)) return;
            if (weeks[currentMonday] && weeks[currentMonday].length > 0) {
                selectedWeekMonday = currentMonday;
            } else {
                const upcoming = weekKeys.filter(k => k >= currentMonday && weeks[k] && weeks[k].length > 0);
                selectedWeekMonday = upcoming.length > 0 ? upcoming[0] : currentMonday;
            }
        }

        function changeWeek(delta) {
            const { weekKeys } = getWeekDataStructure(SCHEDULE_DATA);
            const idx = weekKeys.indexOf(selectedWeekMonday);
            if (idx === -1) return;
            const newIdx = idx + delta;
            if (newIdx >= 0 && newIdx < weekKeys.length) {
                selectedWeekMonday = weekKeys[newIdx];
                renderWeekView(SCHEDULE_DATA);
            }
        }

        function goToCurrentWeek() {
            const { currentMonday } = getWeekDataStructure(SCHEDULE_DATA);
            selectedWeekMonday = currentMonday;
            renderWeekView(SCHEDULE_DATA);
        }

        function renderWeekView(data) {
            const t = I18N[currentLang];
            const navBar = document.getElementById('weekNavBar');
            const titleEl = document.getElementById('weekTitleDisplay');
            const swipeHint = document.getElementById('weekSwipeHint');
            const gridEl = document.getElementById('weekGridDisplay');
            const emptyEl = document.getElementById('weekEmptyState');

            if (!gridEl) return;
            if (data.length === 0) {
                if (navBar) navBar.style.display = 'none';
                if (titleEl) titleEl.style.display = 'none';
                if (swipeHint) swipeHint.style.display = 'none';
                gridEl.innerHTML = '';
                if (emptyEl) {
                    emptyEl.style.display = 'block';
                    emptyEl.textContent = t.emptyFilter;
                }
                return;
            }

            ensureSelectedWeek(data);
            const { weeks, weekKeys, currentMonday } = getWeekDataStructure(data);
            const idx = weekKeys.indexOf(selectedWeekMonday);

            if (navBar) navBar.style.display = 'flex';
            if (titleEl) titleEl.style.display = 'block';
            if (swipeHint) swipeHint.style.display = 'block';

            const btnPrev = document.getElementById('btnPrevWeek');
            const btnNext = document.getElementById('btnNextWeek');
            const btnCurrent = document.getElementById('btnCurrentWeek');

            if (btnPrev) btnPrev.disabled = (idx <= 0);
            if (btnNext) btnNext.disabled = (idx >= weekKeys.length - 1);
            if (btnCurrent) btnCurrent.classList.toggle('is-active', selectedWeekMonday === currentMonday);

            const weekEndMs = selectedWeekMonday + 6 * 24 * 3600 * 1000;
            const fmt = (ms) => {
                const dt = new Date(ms);
                return String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
            };

            titleEl.textContent = t.weekTitlePrefix + fmt(selectedWeekMonday) + ' – ' + fmt(weekEndMs);

            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            const items = weeks[selectedWeekMonday] || [];
            let cellsHtml = '';

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(selectedWeekMonday + i * 24 * 3600 * 1000);
                const dd = String(dayDate.getDate()).padStart(2, '0');
                const mm = String(dayDate.getMonth() + 1).padStart(2, '0');
                const yyyy = dayDate.getFullYear();
                const isToday = dayDate.getTime() === todayStart.getTime();
                cellsHtml += '<div class="week-day-header' + (isToday ? ' week-day-today' : '') + '"><div class="week-day-name">' + t.gridDays[i] + '</div><div class="week-day-date">' + dd + '/' + mm + '/' + yyyy + '</div></div>';
            }

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(selectedWeekMonday + i * 24 * 3600 * 1000);
                const isToday = dayDate.getTime() === todayStart.getTime();
                const dayItems = items.filter(it => {
                    const itDate = new Date(it.timestamp);
                    return itDate.getDate() === dayDate.getDate() && itDate.getMonth() === dayDate.getMonth() && itDate.getFullYear() === dayDate.getFullYear();
                });
                const cardsHtml = dayItems.map(it => {
                    const tag = tagLabel(it.platform);
                    const range = getLiveRange(it);
                    const rangeAttrs = range ? ' data-start-ms="' + range.startMs + '" data-end-ms="' + range.endMs + '"' : '';
                    return '<div class="week-card"' + rangeAttrs + '><div class="week-card-game">' + escapeHtml(it.game) + '</div><div class="week-card-line">' + (it.start || '--:--') + ' - ' + (it.end || '--:--') + '</div><div class="week-card-line week-tag"><span class="tag-platform ' + tag.cls + '">' + tag.icon + tag.text + '</span></div><a class="live-indicator" href="https://youtube.com/@try2_live" target="_blank" rel="noopener noreferrer" style="display:none;">🔴 LIVE</a><span class="countdown-badge" style="display:none;"></span><span class="streamed-badge" style="display:none;">' + t.badgeEnded + '</span></div>';
                }).join('');
                cellsHtml += '<div class="week-day-body' + (isToday ? ' week-day-today' : '') + '">' + cardsHtml + '</div>';
            }

            gridEl.innerHTML = cellsHtml;
            if (emptyEl) {
                emptyEl.style.display = items.length === 0 ? 'block' : 'none';
                emptyEl.textContent = t.emptyWeek;
            }
            updateLiveBadges();
        }

        function switchView(view) {
            const stripBtn = document.getElementById('viewBtnStrip');
            const weekBtn = document.getElementById('viewBtnWeek');
            const stripWrap = document.getElementById('stripViewWrap');
            const weekWrap = document.getElementById('weekViewWrap');
            if (view === 'week') {
                stripBtn.classList.remove('active');
                weekBtn.classList.add('active');
                stripWrap.style.display = 'none';
                weekWrap.style.display = 'block';
            } else {
                weekBtn.classList.remove('active');
                stripBtn.classList.add('active');
                weekWrap.style.display = 'none';
                stripWrap.style.display = 'block';
            }
        }

        function filterSchedule(category, element) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchInput = document.getElementById('gameSearchInput');
            const searchValue = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) clearBtn.style.display = searchValue ? 'block' : 'none';
            const cards = document.querySelectorAll('#scheduleList .schedule-card');
            let anyVisible = false;
            cards.forEach(card => {
                const matchesCategory = currentCategory === 'all' || card.getAttribute('data-category') === currentCategory;
                const gameNameEl = card.querySelector('.game-name');
                const gameName = gameNameEl ? gameNameEl.textContent.toLowerCase() : '';
                const matchesSearch = !searchValue || gameName.includes(searchValue);
                const visible = matchesCategory && matchesSearch;
                card.style.display = visible ? 'grid' : 'none';
                if (visible) anyVisible = true;
            });
            const emptyState = document.getElementById('filterEmptyState');
            if (emptyState) {
                emptyState.style.display = (cards.length > 0 && !anyVisible) ? 'block' : 'none';
                emptyState.textContent = I18N[currentLang].emptyFilter;
            }
        }

        function clearSearch() {
            const searchInput = document.getElementById('gameSearchInput');
            if (searchInput) searchInput.value = '';
            applyFilters();
        }

        function formatCountdown(ms) {
            const t = I18N[currentLang];
            const totalSec = Math.max(0, Math.floor(ms / 1000));
            const mm = Math.floor(totalSec / 60);
            const ss = totalSec % 60;
            return t.countdownPrefix + mm + ':' + String(ss).padStart(2, '0');
        }

        function updateLiveBadges() {
            const now = Date.now();
            const t = I18N[currentLang];
            document.querySelectorAll('.schedule-card[data-start-ms], .week-card[data-start-ms]').forEach(card => {
                const start = Number(card.dataset.startMs);
                const end = Number(card.dataset.endMs);
                const isLive = now >= start && now <= end;
                const isStreamed = now > end;
                const isCountingDown = !isLive && !isStreamed && (start - now) <= 3600000;
                card.classList.toggle('is-live-now', isLive);
                card.classList.toggle('is-streamed', isStreamed);
                const indicator = card.querySelector('.live-indicator');
                if (indicator) indicator.style.display = isLive ? 'inline-flex' : 'none';
                const streamedBadge = card.querySelector('.streamed-badge');
                if (streamedBadge) {
                    streamedBadge.style.display = isStreamed ? 'inline-flex' : 'none';
                    streamedBadge.textContent = t.badgeEnded;
                }
                const countdownBadge = card.querySelector('.countdown-badge');
                if (countdownBadge) {
                    if (isCountingDown) {
                        countdownBadge.textContent = formatCountdown(start - now);
                        countdownBadge.style.display = 'inline-flex';
                    } else {
                        countdownBadge.style.display = 'none';
                    }
                }
            });
        }

        applyLanguage();
        setInterval(updateLiveBadges, 1000);
    </script>
</body>
</html>
